aid: lifestyles-healthcare
name: LifeStyles Healthcare
description: >-
  LifeStyles Healthcare Pte Ltd is a global sexual wellness company that owns the
  LifeStyles condom and personal lubricant brands, tracing its origin to the condom
  business founded by Eric Ansell in Richmond, Australia in 1905. The company sells a
  broad range of latex and non-latex condoms, personal lubricants, and pleasure
  products across North American and international markets, and holds the LifeStyles
  trademarks and intellectual property across multiple jurisdictions. Its North
  American direct-to-consumer storefront at lifestyles.com runs on Shopify and exposes
  a genuinely agent-native commerce surface: a published llms.txt and agents.md, a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a live UCP
  shopping MCP endpoint for agent-driven catalog search, cart and checkout, and Shopify
  Customer Accounts OpenID Connect for buyer-scoped access. There is no traditional
  developer portal or first-party REST API program.
